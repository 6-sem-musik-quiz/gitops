# A stable name and address for the pods: other pods call http://<release name>:<port>
# and Kubernetes spreads the calls over the pods that have the selector's label.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "quiz-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "quiz-service.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http   # the container port named "http" in deployment.yaml
