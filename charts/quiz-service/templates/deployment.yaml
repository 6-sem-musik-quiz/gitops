apiVersion: apps/v1
{{- /* statefulSet.enabled: pods with fixed names <name>-0..N-1 behind <name>-headless, so each pod
       can be addressed on its own (GameService shards, ADR-0004). */}}
kind: {{ if .Values.statefulSet.enabled }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "quiz-service.labels" . | nindent 4 }}
spec:
  {{- if .Values.statefulSet.enabled }}
  serviceName: {{ .Release.Name }}-headless
  # Start and stop the shards together, not one after the other.
  podManagementPolicy: Parallel
  {{- end }}
  {{- /* With autoscaling the HPA owns the pod count. Leaving replicas out keeps
         Flux/Helm from resetting it to replicaCount on every reconcile. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quiz-service.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quiz-service.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.terminationGracePeriodSeconds }}
      # How long Kubernetes waits for preStop and shutdown before it kills the pod.
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Release.Name }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ .Values.port | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Release.Name | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=prod,service.namespace=music-quiz"
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .Values.preStopHttpPath }}
          # Called before the pod is stopped (scale-down, deploy); the pod stops when it returns.
          lifecycle:
            preStop:
              httpGet:
                path: {{ . }}
                port: http
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath | default .Values.probes.path }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
