# Default values. Each HelmRelease in apps/ overrides what differs per service.

image:
  repository: ""        # e.g. ghcr.io/6-sem-musik-quiz/userservice
  tag: ""               # set by Flux image automation
  pullPolicy: IfNotPresent

replicaCount: 1         # ignored when autoscaling.enabled is true

# HorizontalPodAutoscaler (autoscaling/v2) on CPU. Only for stateless services:
# lobbyservice (SignalR) and gameservice (state in memory) keep it off.
# The percentage is of resources.requests.cpu, so a service needs a cpu request.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 120

# StatefulSet instead of Deployment, plus a headless Service <name>-headless, so each pod has a
# fixed name and address (<name>-0..N-1). For gameservice: one shard per pod (ADR-0004).
# replicaCount is then the number of shards; autoscaling must stay off.
statefulSet:
  enabled: false

# The container listens on this port. The Service uses the same port,
# so other pods call http://<name>:8080.
port: 8080

probes:
  path: /health        # liveness
  readinessPath: ""  # empty = same as path; backends use /health/ready (checks Postgres)

# Plain environment variables: NAME: value
env: {}

# Secrets whose keys become environment variables (made by ExternalSecrets).
envFromSecrets: []

# OpenTelemetry: the homelab's Grafana Alloy gateway. The app needs the
# OpenTelemetry .NET SDK with UseOtlpExporter() before anything arrives.
otel:
  enabled: true
  endpoint: http://alloy.monitoring.svc.cluster.local:4317

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# 1654 is the "app" user in the Microsoft .NET images.
# The frontend (nginx-unprivileged) overrides it with 101.
runAsUser: 1654
