# RabbitMQ: the message queue for GameFinished. GameService publishes it to the
# exchange "game-events"; StatisticService (statistics) and LobbyService (reopen the
# lobby) each read it from their own queue.
#
# Plain YAML, not a Bitnami chart: Bitnami removed its RabbitMQ image from
# Docker Hub in 2025 (only an unpatched copy from August 2025 is left in
# "bitnamilegacy"). This uses the official image instead.
#
# User and password in OpenBao at kv/quiz/rabbitmq (properties: username, password).
# Services reach it at rabbitmq.quiz.svc.cluster.local:5672.
# Management UI: kubectl port-forward -n quiz svc/rabbitmq 15672:15672
# Metrics (SCRUM-192): the image's rabbitmq_prometheus plugin on port 15692, scraped by
# the ServiceMonitor at the bottom. Grafana: "Slopster RabbitMQ" in the Quiz org.

# User and password from OpenBao, read by the container below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: rabbitmq-auth
  data:
    - secretKey: username
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: quiz/rabbitmq
        property: password
---
# The address the services use: rabbitmq:5672 (and the management UI on 15672).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    # The rabbitmq_prometheus plugin's port; the container does not list it.
    - name: prometheus
      port: 15692
      targetPort: 15692
---
# Without this RabbitMQ sizes itself from the node's RAM (~12.5 GB), not the pod's
# 512Mi limit, so the pod is OOM-killed long before RabbitMQ's memory alarm would
# block publishers. With it, the alarm trips at 0.6 x 512Mi (vm_memory_high_watermark
# default) and publishers wait instead of the broker dying.
# Keep the value equal to resources.limits.memory below. RabbitMQ reads it at startup
# and a subPath mount is not updated live: restart rabbitmq-0 after changing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    app.kubernetes.io/name: rabbitmq
data:
  20-memory.conf: |
    # 512 MiB in bytes, the pod's memory limit.
    total_memory_available_override_value = 536870912
---
# Headless Service: gives the StatefulSet pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
---
# A StatefulSet, not a Deployment: one pod with a fixed name (rabbitmq-0) and its own
# disk, so queued messages survive a restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # the "rabbitmq" user in the official image
        runAsGroup: 999
        fsGroup: 999
        # Only re-own the volume when its root does not match, not on every start.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Erlang refuses to start ("Cookie file ... must be accessible by owner only")
      # if .erlang.cookie on the data volume has group/other bits, which fsGroup can add.
      # Runs after the kubelet has set volume permissions, so it also repairs a broken file.
      initContainers:
        - name: fix-cookie-perms
          image: rabbitmq:4.1-management
          command:
            - sh
            - -c
            - "if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then chmod 400 /var/lib/rabbitmq/.erlang.cookie; fi"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management   # official image, with the management UI
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:                    # the user RabbitMQ creates on first start
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: password
          readinessProbe:         # ready when RabbitMQ itself answers
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:          # restart if the AMQP port stops accepting connections
            tcpSocket:
              port: amqp
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            # One extra file next to the image's 10-defaults.conf (both are read).
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-memory.conf
              subPath: 20-memory.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  # The disk: a 2 GiB volume for rabbitmq-0, kept when the pod is replaced.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Prometheus (kube-prometheus-stack) picks up ServiceMonitors in every namespace.
# Two scrapes of the same port:
# - /metrics: node-wide totals (messages received / routed / dropped as unroutable,
#   delivered, acked, connections, channels, memory). Per-queue data is off by default.
# - /metrics/detailed: only the two per-queue families the dashboard needs
#   (ready / unacked / total messages and consumers per queue).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
    - port: prometheus
      path: /metrics/detailed
      params:
        family:
          - queue_coarse_metrics
          - queue_consumer_count
      interval: 30s
