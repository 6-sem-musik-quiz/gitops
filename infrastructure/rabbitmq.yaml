# RabbitMQ: the message queue between GameService (publishes game results)
# and StatisticService (consumes them).
#
# Plain YAML, not a Bitnami chart: Bitnami removed its RabbitMQ image from
# Docker Hub in 2025 (only an unpatched copy from August 2025 is left in
# "bitnamilegacy"). This uses the official image instead.
#
# User and password in OpenBao at kv/quiz/rabbitmq (properties: username, password).
# Services reach it at rabbitmq.quiz.svc.cluster.local:5672.
# Management UI: kubectl port-forward -n quiz svc/rabbitmq 15672:15672
# Metrics (SCRUM-192): the image's rabbitmq_prometheus plugin on port 15692, scraped by
# the ServiceMonitor at the bottom. Grafana: "Slopster RabbitMQ" in the Quiz org.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: rabbitmq-auth
  data:
    - secretKey: username
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: quiz/rabbitmq
        property: password
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    # By number, not a named containerPort: adding a port to the StatefulSet would
    # restart rabbitmq-0, and games finishing meanwhile would lose their result.
    - name: prometheus
      port: 15692
      targetPort: 15692
---
# Headless Service: gives the StatefulSet pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # the "rabbitmq" user in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: password
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Prometheus (kube-prometheus-stack) picks up ServiceMonitors in every namespace.
# Two scrapes of the same port:
# - /metrics: node-wide totals (messages received / routed / dropped as unroutable,
#   delivered, acked, connections, channels, memory). Per-queue data is off by default.
# - /metrics/detailed: only the two per-queue families the dashboard needs
#   (ready / unacked / total messages and consumers per queue).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
    - port: prometheus
      path: /metrics/detailed
      params:
        family:
          - queue_coarse_metrics
          - queue_consumer_count
      interval: 30s
