# One PostgreSQL server with one database and one user per service that has a
# database in the C4 design: UserDB, StatsDB and MusicDB.
# Every password lives in OpenBao at kv/quiz/postgres:
#   postgres-password, userservice, musicservice, statisticservice
# Services reach it at postgresql.quiz.svc.cluster.local:5432.

# The admin password for the chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: postgresql-auth
  data:
    - secretKey: postgres-password
      remoteRef:
        key: quiz/postgres
        property: postgres-password
---
# The first-boot script: one user and one database per service.
# It only runs when the volume is empty. To change it later, use psql.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-initdb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: postgresql-initdb
    template:
      engineVersion: v2
      data:
        01-services.sql: |
          CREATE USER userservice WITH PASSWORD '{{ .userservice }}';
          CREATE DATABASE userservice OWNER userservice;
          CREATE USER musicservice WITH PASSWORD '{{ .musicservice }}';
          CREATE DATABASE musicservice OWNER musicservice;
          CREATE USER statisticservice WITH PASSWORD '{{ .statisticservice }}';
          CREATE DATABASE statisticservice OWNER statisticservice;
  dataFrom:
    - extract:
        key: quiz/postgres
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "18.12.20"             # pinned: a new chart version is a deliberate change
      sourceRef:
        kind: HelmRepository
        name: bitnami
  values:
    # Bitnami's PostgreSQL 18.7 image, pinned by digest. The chart's default is the
    # "latest" tag, which would move to a new PostgreSQL version on its own.
    # A digest always means the same image; change it on purpose to upgrade.
    image:
      registry: registry-1.docker.io
      repository: bitnami/postgresql
      digest: "sha256:ec2ef1dfb067c66aa83081405438e80786b4fae4647ca94330e0fc94398b9207"
    auth:                              # the admin password from the first ExternalSecret
      existingSecret: postgresql-auth
      secretKeys:
        adminPasswordKey: postgres-password
    primary:
      initdb:
        scriptsSecret: postgresql-initdb   # the first-boot SQL from the second ExternalSecret
      persistence:
        size: 5Gi                      # the disk with all three databases
      resourcesPreset: none            # use our own requests and limits below
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
---
# Postgres on the tailnet, so pgAdmin/psql work without kubectl port-forward:
#   quiz-postgres.tail5a1bc5.ts.net:5432
# Only reachable over Tailscale. The homelab only allows class tailscale here.
# Tailscale ACL: group:quiz -> tag:quiz-postgres tcp:5432 (set in the admin console).
apiVersion: v1
kind: Service
metadata:
  name: postgresql-tailnet
  annotations:
    tailscale.com/hostname: quiz-postgres
    # Own tag, so the Tailscale ACL can give group:quiz tcp:5432 here and
    # nothing else (tag:k8s is shared with Traefik and hello-api).
    tailscale.com/tags: tag:quiz-postgres
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale         # the Tailscale operator makes the tailnet address
  allocateLoadBalancerNodePorts: false # node ports are not allowed in quiz
  selector:                            # SCRUM-201: the quizdb primary (read and write)
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: quizdb
    app.kubernetes.io/name: postgresql
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
