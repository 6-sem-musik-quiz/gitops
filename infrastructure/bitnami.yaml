# The Bitnami charts, the same ones the class uses
# (helm install ... oci://registry-1.docker.io/bitnamicharts/<chart>).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
spec:
  type: oci                                       # the charts are stored as OCI images
  url: oci://registry-1.docker.io/bitnamicharts
  interval: 12h                                   # how often Flux checks for new chart versions
