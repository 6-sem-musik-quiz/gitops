# Redis: the active lobbies (LobbyService), the running games (GameService, ADR-0004)
# and the SignalR backplane for both. Same setup as the class file redis-values.yaml:
# one instance, no disk.
# Password in OpenBao at kv/quiz/redis (property: password).
# Services reach it at redis-master.quiz.svc.cluster.local:6379.

# The password, from OpenBao, as the Secret the chart reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: redis-auth
  data:
    - secretKey: redis-password
      remoteRef:
        key: quiz/redis
        property: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
spec:
  interval: 30m
  chart:
    spec:
      chart: redis
      version: "28.3.12"              # pinned: a new chart version is a deliberate change
      sourceRef:
        kind: HelmRepository
        name: bitnami
  values:
    architecture: standalone           # one instance, no replicas
    auth:                              # password from the Secret above
      enabled: true
      existingSecret: redis-auth
      existingSecretPasswordKey: redis-password
    master:
      persistence:
        enabled: false   # no disk: after a Redis restart the lobbies and running games are gone (ADR-0004)
      resourcesPreset: none            # use our own requests and limits below
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    # redis_exporter as a sidecar on :9121, scraped by the homelab Prometheus
    # through the ServiceMonitor. Shows in Grafana (Quiz org): hit rate, memory,
    # keys, clients, commands/s. The chart's NetworkPolicy opens 9121 for it.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      resourcesPreset: none
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
