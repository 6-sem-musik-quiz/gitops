# Redis: the cache for LobbyService (and later the SignalR backplane).
# Same setup as the class file redis-values.yaml: one master, no disk.
# Password in OpenBao at kv/quiz/redis (property: password).
# Services reach it at redis-master.quiz.svc.cluster.local:6379.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: redis-auth
  data:
    - secretKey: redis-password
      remoteRef:
        key: quiz/redis
        property: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
spec:
  interval: 30m
  chart:
    spec:
      chart: redis
      version: "28.3.12"
      sourceRef:
        kind: HelmRepository
        name: bitnami
  values:
    architecture: standalone
    auth:
      enabled: true
      existingSecret: redis-auth
      existingSecretPasswordKey: redis-password
    master:
      persistence:
        enabled: false   # a cache can be lost on restart
      resourcesPreset: none
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
