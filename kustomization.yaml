# The entry point. The homelab's Flux Kustomization "quiz" applies this folder
# into the namespace quiz, as the service account quiz-flux.
# Kustomize reads the two folders below (each has its own kustomization.yaml)
# and puts everything in the namespace "quiz".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quiz
resources:
  - infrastructure   # databases, cache, message queue and file storage
  - apps             # our own services, plus Flux's image automation
