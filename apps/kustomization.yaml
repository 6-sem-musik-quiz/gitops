# Our own services. Each file holds the service's secrets (ExternalSecret) and its
# deployment (HelmRelease, using the chart in charts/quiz-service).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - userservice.yaml
  - lobbyservice.yaml
  - gameservice.yaml
  - musicservice.yaml
  - statisticservice.yaml
  - edgeservice.yaml
  - frontend.yaml
  - image-automation.yaml   # deploys new images from GHCR automatically
