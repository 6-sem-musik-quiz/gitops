# Frontend: Blazor WebAssembly, published as static files and served by
# nginx-unprivileged (listens on 8080, runs as user 101).
# Cloudflare Tunnel sends https://quiz.munkcloud.dk/* (everything except /api
# and /hubs) here. The browser calls /api on the same hostname, so no CORS.
#
# The Frontend repo needs a Dockerfile like:
#   FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
#   ... dotnet publish -c Release -o /app/publish
#   FROM nginxinc/nginx-unprivileged:1.29-alpine
#   COPY --from=build /app/publish/wwwroot /usr/share/nginx/html
#   COPY nginx.conf /etc/nginx/conf.d/default.conf   # try_files $uri /index.html; and /health
#
# Not in apps/kustomization.yaml yet: the Frontend repo has no code and no image.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/frontend
      tag: 0-00000000-0 # {"$imagepolicy": "quiz:frontend:tag"}
    runAsUser: 101
    otel:
      enabled: false   # static files: nothing to trace on the server
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
