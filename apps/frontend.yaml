# Frontend: Blazor WebAssembly, published as static files and served by
# nginx-unprivileged (listens on 8080, runs as user 101). Image built in the
# Frontend repo (Dockerfile + nginx.conf).
# Cloudflare Tunnel sends https://quiz.munkcloud.dk/* (everything except /api)
# here. The app runs in the browser and calls /api/<service>/ on the same
# hostname, which the tunnel sends to edgeservice, so no CORS.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/frontend
      tag: 19-76093f11-1795522519 # {"$imagepolicy": "quiz:frontend:tag"}
    runAsUser: 101
    autoscaling:
      enabled: true # stateless: HPA on CPU (chart defaults: 2-5 pods, 70 %)
    otel:
      enabled: false # static files: nothing to trace on the server
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
