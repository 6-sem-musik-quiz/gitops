# EdgeService: the API gateway (YARP). The only backend that the internet reaches.
# Cloudflare Tunnel sends https://quiz.munkcloud.dk/api/* to
# http://edgeservice.quiz.svc.cluster.local:8080. YARP routes /api/<service>/<rest>
# to http://<service>:8080/api/<rest>, e.g. /api/userservice/users/1 -> userservice
# /api/users/1. The edge's own endpoints are under /api/edge.
# The routes live in the EdgeService repo (appsettings.json), not here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edgeservice
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/edgeservice
      tag: 15-1adfb5a4-1795690430 # {"$imagepolicy": "quiz:edgeservice:tag"}
    autoscaling:
      enabled: true # min 2: the single entry point keeps one pod up during a rollout
