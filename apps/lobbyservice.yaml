# LobbyService: lobbies. No SQL database in the C4 design; active lobbies live in Redis.
#
# Secret: the Redis connection string, built from the password in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lobbyservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: lobbyservice-secrets
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Redis: "redis-master.quiz.svc.cluster.local:6379,password={{ .redisPassword }}"
  data:
    - secretKey: redisPassword
      remoteRef:
        key: quiz/redis
        property: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lobbyservice
spec:
  interval: 10m
  dependsOn:
    - name: redis
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/lobbyservice
      tag: 14-e79cf21d-1795182334 # {"$imagepolicy": "quiz:lobbyservice:tag"}
    probes:
      readinessPath: /health/ready # ready only when Redis answers
    envFromSecrets:
      - lobbyservice-secrets
