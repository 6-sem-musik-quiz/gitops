# LobbyService: lobbies. No SQL database in the C4 design; active lobbies live in Redis.
#
# Secrets: the Redis connection string, built from the password in OpenBao, the
# JWT signing key (kv/quiz/jwt, the same key UserService signs its tokens with) and the
# RabbitMQ login (kv/quiz/rabbitmq, as StatisticService). SCRUM-172: LobbyService consumes
# GameService's GameFinished from its own queue lobbyservice.game-finished and reopens the
# lobby for "Spil igen".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lobbyservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: lobbyservice-secrets
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Redis: "redis-master.quiz.svc.cluster.local:6379,password={{ .redisPassword }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
        RabbitMQ__Host: "rabbitmq.quiz.svc.cluster.local"
        RabbitMQ__Username: "{{ .rabbitUser }}"
        RabbitMQ__Password: "{{ .rabbitPassword }}"
  data:
    - secretKey: redisPassword
      remoteRef:
        key: quiz/redis
        property: password
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
    - secretKey: rabbitUser
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: rabbitPassword
      remoteRef:
        key: quiz/rabbitmq
        property: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lobbyservice
spec:
  interval: 10m
  dependsOn:
    - name: redis
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/lobbyservice
      tag: 41-3c39d257-1795694049 # {"$imagepolicy": "quiz:lobbyservice:tag"}
    probes:
      readinessPath: /health/ready # ready only when Redis answers
    env:
      # Called inside the cluster (not through the edge): the playlist check when a lobby is
      # created, and POST /api/games when the host starts the game. Without these the app
      # falls back to its local-dev defaults (localhost:5002/5005) and every call fails.
      MusicService__BaseUrl: http://musicservice.quiz.svc.cluster.local:8080/
      Services__GameService: http://gameservice.quiz.svc.cluster.local:8080/
    envFromSecrets:
      - lobbyservice-secrets
    # Kept away from the image tag above, which Flux rewrites ("Update images"), so the two never conflict.
    autoscaling:
      # HPA on CPU (chart defaults: 2-5 pods, 70 %). Possible since SCRUM-128: SignalR uses Redis as
      # backplane, so a lobby update reaches players on every pod, and the hub is WebSockets-only
      # without negotiate, so a connection never spans two pods.
      enabled: true
