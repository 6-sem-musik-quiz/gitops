# GameService: runs the games, publishes results to RabbitMQ. No SQL database in the C4 design.
# ADR-0004: the running games are in Redis (the same as LobbyService's), so GameService is stateless
# and autoscales like the other services (chart HPA, 2-5 pods); any pod can serve any game.
#
# Secrets: the RabbitMQ settings and the Redis connection string, built from the passwords in OpenBao,
# and the JWT signing key (kv/quiz/jwt, the same key UserService signs its tokens with). Without the
# key every request and hub connection gets 401, so LobbyService cannot create games.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gameservice-secrets
spec:
  refreshInterval: 1h               # read OpenBao again every hour
  secretStoreRef:                   # where the values come from: OpenBao
    kind: SecretStore
    name: openbao
  target:
    name: gameservice-secrets
    # The Secret's keys, built from the values fetched under "data" below.
    # Each key becomes an environment variable in the pod (envFromSecrets).
    template:
      engineVersion: v2
      data:
        RabbitMQ__Host: "rabbitmq.quiz.svc.cluster.local"
        RabbitMQ__Username: "{{ .rabbitUser }}"
        RabbitMQ__Password: "{{ .rabbitPassword }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
        ConnectionStrings__Redis: "redis-master.quiz.svc.cluster.local:6379,password={{ .redisPassword }}"
  # Values fetched from OpenBao: secretKey = the name used in the template above.
  data:
    - secretKey: redisPassword
      remoteRef:
        key: quiz/redis
        property: password
    - secretKey: rabbitUser
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: rabbitPassword
      remoteRef:
        key: quiz/rabbitmq
        property: password
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gameservice
spec:
  interval: 10m                     # how often Flux checks that the release matches Git
  dependsOn:                        # deploy only after redis is ready
    - name: redis
  chart:
    spec:
      chart: ./charts/quiz-service    # our own chart, from this repo
      reconcileStrategy: Revision     # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository           # this repo, as Flux knows it
        name: quiz
  values:                           # overrides charts/quiz-service/values.yaml
    image:
      repository: ghcr.io/6-sem-musik-quiz/gameservice
      tag: 47-a7f98629-1795708897 # {"$imagepolicy": "quiz:gameservice:tag"}
    env:
      # Called inside the cluster (not through the edge) for the songs of a new game:
      # GET /api/playlists/{id}/songs/random. Without it the app falls back to its local-dev
      # default (localhost:5002) and every game start fails with 502.
      Services__MusicService: http://musicservice.quiz.svc.cluster.local:8080/
    probes:
      readinessPath: /health/ready # ready only when Redis answers
    envFromSecrets:                   # the Secret made by the ExternalSecret above
      - gameservice-secrets
