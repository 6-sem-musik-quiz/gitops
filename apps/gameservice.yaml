# GameService: runs the games, publishes results to RabbitMQ. No SQL database in the C4 design.
#
# Secret: the RabbitMQ settings, built from the passwords in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gameservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: gameservice-secrets
    template:
      engineVersion: v2
      data:
        RabbitMQ__Host: "rabbitmq.quiz.svc.cluster.local"
        RabbitMQ__Username: "{{ .rabbitUser }}"
        RabbitMQ__Password: "{{ .rabbitPassword }}"
  data:
    - secretKey: rabbitUser
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: rabbitPassword
      remoteRef:
        key: quiz/rabbitmq
        property: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gameservice
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/gameservice
      tag: 14-0c01a20e-1795527674 # {"$imagepolicy": "quiz:gameservice:tag"}
    envFromSecrets:
      - gameservice-secrets
