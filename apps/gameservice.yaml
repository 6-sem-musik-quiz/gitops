# GameService: runs the games, publishes results to RabbitMQ. No SQL database in the C4 design.
#
# Secrets: the RabbitMQ settings, built from the passwords in OpenBao, and the JWT signing key
# (kv/quiz/jwt, the same key UserService signs its tokens with). Without the key every request
# and hub connection gets 401, so LobbyService cannot create games.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gameservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: gameservice-secrets
    template:
      engineVersion: v2
      data:
        RabbitMQ__Host: "rabbitmq.quiz.svc.cluster.local"
        RabbitMQ__Username: "{{ .rabbitUser }}"
        RabbitMQ__Password: "{{ .rabbitPassword }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
  data:
    - secretKey: rabbitUser
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: rabbitPassword
      remoteRef:
        key: quiz/rabbitmq
        property: password
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gameservice
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/gameservice
      tag: 38-7418c972-1795690418 # {"$imagepolicy": "quiz:gameservice:tag"}
    env:
      # Called inside the cluster (not through the edge) for the songs of a new game:
      # GET /api/playlists/{id}/songs/random. Without it the app falls back to its local-dev
      # default (localhost:5002) and every game start fails with 502.
      Services__MusicService: http://musicservice.quiz.svc.cluster.local:8080/
    # ADR-0004: games are kept in memory, and each game lives in the pod that created it. The pod's
    # number (from its name, gameservice-k) is the first two hex characters of the gameId, and the edge
    # routes by it, so pods can be added and removed without moving a game.
    statefulSet:
      enabled: true
    autoscaling:
      enabled: true
      minReplicas: 2 # one pod can drain or roll out while the other takes new games
      maxReplicas: 4 # must not exceed GameSharding__MaxShards in apps/edgeservice.yaml (16)
    probes:
      path: /health
      readinessPath: /health/ready # fails while the pod drains, so new games go to the other pods
    # Before a pod stops (scale-down or deploy) it takes no new games and waits until its games are
    # over. The longest game is 20 rounds of up to ~75 s (about 25 min), so allow 30 min.
    preStopHttpPath: /internal/drain
    terminationGracePeriodSeconds: 1800
    envFromSecrets:
      - gameservice-secrets
