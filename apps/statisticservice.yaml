# StatisticService: consumes game results from RabbitMQ. Database: statisticservice.
#
# Secret: the connection strings, built from the passwords in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: statisticservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: statisticservice-secrets
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=postgresql.quiz.svc.cluster.local;Port=5432;Database=statisticservice;Username=statisticservice;Password={{ .dbPassword }}"
        RabbitMQ__Host: "rabbitmq.quiz.svc.cluster.local"
        RabbitMQ__Username: "{{ .rabbitUser }}"
        RabbitMQ__Password: "{{ .rabbitPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: statisticservice
    - secretKey: rabbitUser
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: rabbitPassword
      remoteRef:
        key: quiz/rabbitmq
        property: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: statisticservice
spec:
  interval: 10m
  dependsOn:
    - name: postgresql
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/statisticservice
      tag: 15-963fc95e-1795517218 # {"$imagepolicy": "quiz:statisticservice:tag"}
    envFromSecrets:
      - statisticservice-secrets
    autoscaling:
      enabled: true # stateless: HPA on CPU (chart defaults: 2-5 pods, 70 %)
