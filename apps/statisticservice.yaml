# StatisticService: consumes game results from RabbitMQ. Database: statisticservice.
#
# Secret: the connection strings, built from the passwords in OpenBao, and the JWT signing
# key (kv/quiz/jwt, the same key UserService signs its tokens with). Without the key every
# request to /api/statistics/* is rejected with 401 (SCRUM-188). The Redis password (kv/quiz/redis,
# the same Redis as LobbyService and GameService) is for the leaderboard cache (SCRUM-195).
#
# Autoscaled by the chart's HPA (2-10 pods on CPU). RabbitMQ hands each message
# to only one of the pods, so a result is never counted twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: statisticservice-secrets
spec:
  refreshInterval: 1h # read OpenBao again every hour
  secretStoreRef: # where the values come from: OpenBao
    kind: SecretStore
    name: openbao
  target:
    name: statisticservice-secrets
    # The Secret's keys, built from the values fetched under "data" below.
    # Each key becomes an environment variable in the pod (envFromSecrets).
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=quizdb-postgresql-primary.quiz.svc.cluster.local;Port=5432;Database=statisticservice;Username=statisticservice;Password={{ .dbPassword }}"
        # SCRUM-202: reads ("my stats", leaderboard fallback) go to the read replicas.
        ConnectionStrings__Read: "Host=quizdb-postgresql-read.quiz.svc.cluster.local;Port=5432;Database=statisticservice;Username=statisticservice;Password={{ .dbPassword }}"
        RabbitMQ__Host: "rabbitmq.quiz.svc.cluster.local"
        RabbitMQ__Username: "{{ .rabbitUser }}"
        RabbitMQ__Password: "{{ .rabbitPassword }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
        # SCRUM-195: the weekly leaderboard cache (write-through). Optional: without Redis the
        # leaderboard is read from Postgres, so the HelmRelease does not depend on redis.
        ConnectionStrings__Redis: "redis-master.quiz.svc.cluster.local:6379,password={{ .redisPassword }}"
  # Values fetched from OpenBao: secretKey = the name used in the template above.
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: statisticservice
    - secretKey: rabbitUser
      remoteRef:
        key: quiz/rabbitmq
        property: username
    - secretKey: rabbitPassword
      remoteRef:
        key: quiz/rabbitmq
        property: password
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
    - secretKey: redisPassword
      remoteRef:
        key: quiz/redis
        property: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: statisticservice
spec:
  interval: 10m # how often Flux checks that the release matches Git
  dependsOn: # deploy only after the database (quizdb) is ready
    - name: quizdb
  chart:
    spec:
      chart: ./charts/quiz-service # our own chart, from this repo
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository # this repo, as Flux knows it
        name: quiz
  values: # overrides charts/quiz-service/values.yaml
    autoscaling:
      maxReplicas: 10 # stress test 2026-11-27: hit the chart's 5 while the node used 1.7 of 5 cores
    image:
      repository: ghcr.io/6-sem-musik-quiz/statisticservice
      tag: 46-a19854d8-1795784329 # {"$imagepolicy": "quiz:statisticservice:tag"}
    envFromSecrets: # the Secret made by the ExternalSecret above
      - statisticservice-secrets
