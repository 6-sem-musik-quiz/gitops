# Flux image automation: Flux watches GHCR, and when CI pushes a new image it
# writes the new tag into apps/*.yaml (at the {"$imagepolicy": ...} markers)
# and pushes the commit to main. Nobody edits an image tag by hand.
#
# Tag format from CI: <run number>-<8 char sha>-<unix time>, e.g. 12-a1b2c3d4-1791234567.
# The newest unix time wins (the run number restarts if the workflow file is renamed).
#
# Every service has the same pair: an ImageRepository (which image to watch) and an
# ImagePolicy (which of its tags is the newest). The first pair is commented; the
# others only differ in the name. At the bottom, ImageUpdateAutomation writes the
# chosen tags into Git.
---
# Lists the image's tags in GHCR every 5 minutes.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: edgeservice
spec:
  image: ghcr.io/6-sem-musik-quiz/edgeservice
  interval: 5m
---
# Picks the newest tag: only tags that match the CI format count, the unix time
# at the end is taken out ("ts"), and the biggest number wins.
# The HelmRelease's {"$imagepolicy": "quiz:edgeservice:tag"} marker points here.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: edgeservice
spec:
  imageRepositoryRef:
    name: edgeservice
  filterTags:
    pattern: '^\d+-[a-f0-9]{8}-(?P<ts>\d+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
