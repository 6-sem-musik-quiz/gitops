---
# Every 5 minutes: check out main, put the newest tags into the files under ./apps
# (at the {"$imagepolicy": ...} markers, "Setters"), commit as fluxcdbot and push to main.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: quiz
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: quiz
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        Update images

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./apps
    strategy: Setters
