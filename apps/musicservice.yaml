# MusicService: songs and playlists. Database: musicservice. Song files: Garage (infrastructure/garage.yaml, README "BlobStorage").
#
# Secret: the connection strings, built from the passwords in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: musicservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: musicservice-secrets
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=postgresql.quiz.svc.cluster.local;Port=5432;Database=musicservice;Username=musicservice;Password={{ .dbPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: musicservice
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: musicservice
spec:
  interval: 10m
  dependsOn:
    - name: postgresql
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/musicservice
      tag: 13-0bd5d954-1795193462 # {"$imagepolicy": "quiz:musicservice:tag"}
    envFromSecrets:
      - musicservice-secrets
