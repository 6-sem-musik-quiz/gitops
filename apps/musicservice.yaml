# MusicService: songs and playlists. Database: musicservice. Song files: Garage (infrastructure/garage.yaml, README "BlobStorage").
#
# Secret: the connection strings, the S3 key for Garage and the JWT signing key
# (kv/quiz/jwt, the same key UserService signs its tokens with), from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: musicservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: musicservice-secrets
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=postgresql.quiz.svc.cluster.local;Port=5432;Database=musicservice;Username=musicservice;Password={{ .dbPassword }}"
        BlobStorage__AccessKeyId: "{{ .blobAccessKeyId }}"
        BlobStorage__SecretAccessKey: "{{ .blobSecretAccessKey }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: musicservice
    - secretKey: blobAccessKeyId
      remoteRef:
        key: quiz/blobstorage
        property: access-key-id
    - secretKey: blobSecretAccessKey
      remoteRef:
        key: quiz/blobstorage
        property: secret-access-key
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: musicservice
spec:
  interval: 10m
  dependsOn:
    - name: postgresql
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/musicservice
      tag: 34-4474ed86-1795708942 # {"$imagepolicy": "quiz:musicservice:tag"}
    env:
      BlobStorage__ServiceUrl: http://garage.quiz.svc.cluster.local:3900
      BlobStorage__Bucket: media
      BlobStorage__PublicBaseUrl: https://media.munkcloud.dk # Cloudflare CDN in front of the bucket
    envFromSecrets:
      - musicservice-secrets
    autoscaling:
      enabled: true # stateless: HPA on CPU (chart defaults: 2-5 pods, 70 %)
