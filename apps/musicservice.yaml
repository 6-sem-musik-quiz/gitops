# MusicService: songs and playlists. Database: musicservice. Song files: Garage (infrastructure/garage.yaml, README "BlobStorage").
#
# Secret: the connection strings, the S3 key for Garage and the JWT signing key
# (kv/quiz/jwt, the same key UserService signs its tokens with), from OpenBao.
#
# Autoscaled by the chart's HPA (2-5 pods on CPU); files are in Garage, not in the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: musicservice-secrets
spec:
  refreshInterval: 1h # read OpenBao again every hour
  secretStoreRef: # where the values come from: OpenBao
    kind: SecretStore
    name: openbao
  target:
    name: musicservice-secrets
    # The Secret's keys, built from the values fetched under "data" below.
    # Each key becomes an environment variable in the pod (envFromSecrets).
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=quizdb-postgresql-primary.quiz.svc.cluster.local;Port=5432;Database=musicservice;Username=musicservice;Password={{ .dbPassword }}"
        BlobStorage__AccessKeyId: "{{ .blobAccessKeyId }}"
        BlobStorage__SecretAccessKey: "{{ .blobSecretAccessKey }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
  # Values fetched from OpenBao: secretKey = the name used in the template above.
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: musicservice
    - secretKey: blobAccessKeyId
      remoteRef:
        key: quiz/blobstorage
        property: access-key-id
    - secretKey: blobSecretAccessKey
      remoteRef:
        key: quiz/blobstorage
        property: secret-access-key
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: musicservice
spec:
  interval: 10m # how often Flux checks that the release matches Git
  dependsOn: # deploy only after the database (quizdb) is ready
    - name: quizdb
  chart:
    spec:
      chart: ./charts/quiz-service # our own chart, from this repo
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository # this repo, as Flux knows it
        name: quiz
  values: # overrides charts/quiz-service/values.yaml
    image:
      repository: ghcr.io/6-sem-musik-quiz/musicservice
      tag: 36-96b0a303-1795733841 # {"$imagepolicy": "quiz:musicservice:tag"}
    env:
      # Garage's S3 API inside the cluster, where uploads go. The bucket is "media" (the default in code).
      BlobStorage__ServiceUrl: http://garage.quiz.svc.cluster.local:3900
      # Where the browser downloads song files from: Cloudflare CDN in front of the bucket.
      BlobStorage__PublicBaseUrl: https://media.munkcloud.dk
    envFromSecrets: # the Secret made by the ExternalSecret above
      - musicservice-secrets
