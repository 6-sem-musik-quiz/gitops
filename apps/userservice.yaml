# UserService: login, profiles. Database: userservice.
#
# Secrets: the connection strings, built from the passwords in OpenBao, and the
# JWT signing key (kv/quiz/jwt) that UserService signs its tokens with. The
# other services validate tokens with the same key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: userservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: userservice-secrets
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=postgresql.quiz.svc.cluster.local;Port=5432;Database=userservice;Username=userservice;Password={{ .dbPassword }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: userservice
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: userservice
spec:
  interval: 10m
  dependsOn:
    - name: postgresql
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/userservice
      tag: 23-778e0283-1795513225 # {"$imagepolicy": "quiz:userservice:tag"}
    envFromSecrets:
      - userservice-secrets
    autoscaling:
      enabled: true # stateless: HPA on CPU (chart defaults: 2-5 pods, 70 %)
