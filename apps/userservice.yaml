# UserService: login, profiles. Database: userservice.
#
# Secrets: the connection strings, built from the passwords in OpenBao, and the
# JWT signing key (kv/quiz/jwt) that UserService signs its tokens with. The
# other services validate tokens with the same key.
#
# Autoscaled by the chart's HPA (2-10 pods on CPU); it is stateless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: userservice-secrets
spec:
  refreshInterval: 1h # read OpenBao again every hour
  secretStoreRef: # where the values come from: OpenBao
    kind: SecretStore
    name: openbao
  target:
    name: userservice-secrets
    # The Secret's keys, built from the values fetched under "data" below.
    # Each key becomes an environment variable in the pod (envFromSecrets).
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=quizdb-postgresql-primary.quiz.svc.cluster.local;Port=5432;Database=userservice;Username=userservice;Password={{ .dbPassword }}"
        Jwt__SigningKey: "{{ .jwtSigningKey }}"
  # Values fetched from OpenBao: secretKey = the name used in the template above.
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: userservice
    - secretKey: jwtSigningKey
      remoteRef:
        key: quiz/jwt
        property: signing-key
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: userservice
spec:
  interval: 10m # how often Flux checks that the release matches Git
  dependsOn: # deploy only after the database (quizdb) is ready
    - name: quizdb
  chart:
    spec:
      chart: ./charts/quiz-service # our own chart, from this repo
      reconcileStrategy: Revision # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository # this repo, as Flux knows it
        name: quiz
  values: # overrides charts/quiz-service/values.yaml
    autoscaling:
      maxReplicas: 10 # stress test 2026-11-27: hit the chart's 5 while the node used 1.7 of 5 cores
    image:
      repository: ghcr.io/6-sem-musik-quiz/userservice
      tag: 41-700b3ec5-1795782122 # {"$imagepolicy": "quiz:userservice:tag"}
    envFromSecrets: # the Secret made by the ExternalSecret above
      - userservice-secrets
