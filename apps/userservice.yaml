# UserService: login, profiles. Database: userservice.
#
# Secret: the connection strings, built from the passwords in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: userservice-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: userservice-secrets
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Default: "Host=postgresql.quiz.svc.cluster.local;Port=5432;Database=userservice;Username=userservice;Password={{ .dbPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: quiz/postgres
        property: userservice
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: userservice
spec:
  interval: 10m
  dependsOn:
    - name: postgresql
  chart:
    spec:
      chart: ./charts/quiz-service
      reconcileStrategy: Revision   # a chart change in Git is picked up without a version bump
      sourceRef:
        kind: GitRepository
        name: quiz
  values:
    image:
      repository: ghcr.io/6-sem-musik-quiz/userservice
      tag: 0-00000000-0 # {"$imagepolicy": "quiz:userservice:tag"}
    envFromSecrets:
      - userservice-secrets
